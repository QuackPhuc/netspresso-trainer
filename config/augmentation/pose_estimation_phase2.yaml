# Phase 2: Medium Augmentation (Stabilization)
# Goal: Reduce noise, start converging to realistic distribution
# Duration: 50 epochs, early_stop: 25
# LR: 1e-4 (Medium learning rate for refinement)

augmentation:
  train:
    -
      name: randomhorizontalflip
      p: 0.5
    - 
      name: posetopdownaffine
      scale: [0.75, 1.25]      # Narrower scale range
      scale_prob: 1.
      translate: 0.15          # Moderate translation
      translate_prob: 1.
      rotation: 30             # Reduced rotation
      rotation_prob: 1.
      size: [256, 256]
    -
      name: colorjitter        # Keep color aug but reduce intensity
      brightness: 0.2
      contrast: 0.2
      saturation: 0.15
      hue: 0.05
      p: 0.3                   # Lower probability
    -
      name: totensor
      pixel_range: 1.0
    -
      name: normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
      
  inference:
    - 
      name: posetopdownaffine
      scale: [1., 1.]
      scale_prob: 0.
      translate: 0.
      translate_prob: 0.
      rotation: 0
      rotation_prob: 0.
      size: [256, 256]
    -
      name: totensor
      pixel_range: 1.0
    -
      name: normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
